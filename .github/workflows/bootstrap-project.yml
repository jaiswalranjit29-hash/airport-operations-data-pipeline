name: Bootstrap project files

on:
  push:
    branches: [main]
    paths:
      - '.project.ready'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct project archive
        shell: bash
        run: |
          set -euo pipefail
          cat .project.part* | base64 --decode > /tmp/project.zip
          rm -rf /tmp/project
          mkdir -p /tmp/project
          unzip -q /tmp/project.zip -d /tmp/project
          PROJECT_ROOT="$(find /tmp/project -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$PROJECT_ROOT"
          rsync -a --delete --exclude='.git/' "$PROJECT_ROOT/" ./
      - name: Commit portfolio-ready project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish portfolio-ready data pipeline"
          git push origin main
