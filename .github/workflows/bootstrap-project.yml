name: Bootstrap project files

on:
  push:
    branches: [main]
    paths:
      - '.project.ready'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct project source
        shell: bash
        run: |
          set -euo pipefail
          cat .project.part* | base64 --decode > /tmp/project.tar.gz
          rm -rf /tmp/project
          mkdir -p /tmp/project
          tar -xzf /tmp/project.tar.gz -C /tmp/project
          rsync -a --delete --exclude='.git/' /tmp/project/ ./

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate and validate demo outputs
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_demo_data.py --rows 800 --seed 42 --output data/raw/flights_raw.csv
          python -m src.main
          python -m unittest discover -s tests -v

      - name: Commit portfolio-ready project
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/python-tests.yml
          git restore --source=HEAD -- .github/workflows/bootstrap-project.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish portfolio-ready data pipeline"
          git push origin main
